body{

/* Header */

nav{
    display:flex;

    align-items:center;
    padding:15px 50px;
    background:#003366;
    color:white;
}

.logo{
    display:flex;
    align-items:center;
}

.logo-circle{
    width:60px;
    height:60px;
    background:#ff9800;
    border-radius:50%;

    justify-content:center;
    align-items:center;
    margin-right:15px;
    font-weight:bold;
}

.search input{
    padding:10px;
    width:280px;
    border-radius:20px;
    border:none;
}

.login-btn{
    background:#ff9800;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:20px;
}

/* Home */

.hero{
    text-align:center;
    padding:50px;
}

.hero h1{
    color:#003366;
}

.semester-grid{
    margin:40px;
    display:grid;
    grid-template-columns:repeat(3,180px);
    justify-content:center;
    gap:20px;
}

.semester-grid button{
    padding:15px;
    background:#003366;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.semester-grid button:hover{
    background:#ff9800;
}

/* Content */

.box{
    width:450px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 5px 15px #ccc;
}

.item{
    background:#003366;
    color:white;
    padding:15px;
    margin:10px;
    border-radius:8px;
    cursor:pointer;
}

.item:hover{
    background:#ff9800;
}

/* Back Button */

.back-btn{
    background:#ff9800;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:15px;
    font-weight:bold;
}

.back-btn:hover{
    background:#003366;
}

footer{
    background:#003366;
    color:white;
    padding:20px;
    text-align:center;
}

document.getElementById("content").innerHTML=html;
